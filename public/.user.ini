; PHP overrides for GINTEC Solutions
; Increases upload limits so images larger than the default 2MB can be uploaded.
; Applies to public_html (and subfolders) on FastCGI/PHP-FPM hosting.

upload_max_filesize = 10M
post_max_size = 12M
max_file_uploads = 20
memory_limit = 256M
max_execution_time = 120
